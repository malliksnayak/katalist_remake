spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-oss-safeguard-20b
spring.jackson.serialization.indent_output=true

# ─── Application log levels ──────────────────────────────────────────────────
# INFO for everything by default
logging.level.root=INFO

# DEBUG for our own code (shows prompts, raw responses, sanitised JSON, etc.)
logging.level.com.katalist.katalistremake=DEBUG

# DEBUG for Spring AI core – logs chat request/response objects
logging.level.org.springframework.ai=DEBUG

# DEBUG for the OpenAI HTTP client – shows full request/response wire data
logging.level.org.springframework.web.client.RestClient=DEBUG

# Optional: see full HTTP traffic at wire level (very verbose)
# logging.level.org.apache.http=DEBUG
# logging.level.org.apache.http.wire=DEBUG

# ─── Log format ───────────────────────────────────────────────────────────────
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5level) %clr([%15.15thread]){faint} %clr(%-40.40logger{39}){cyan} : %msg%n

# ─── TTS & Storage Configuration ──────────────────────────────────────────────
video.narration.provider=kokoro
kokoro.service.url=http://localhost:8000/audio
storage.path=./storage
runpod.api.key=${RUNPOD_API_KEY}
runpod.api.sdxl-turbo.url=https://api.runpod.ai/v2/2n23lvb8kgewxi/runsync
runpod.api.sdxl.url=https://api.runpod.ai/v2/7iu3xrb25n15t6/runsync
runpod.api.flux.url=https://api.runpod.ai/v2/black-forest-labs-flux-1-schnell/runsync

# ─── Database Configuration ──────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/katalist_db
spring.datasource.username=${POSTGRES_USER:katalist_user}
spring.datasource.password=${POSTGRES_PASSWORD:katalist_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Move SQL logs into the standard framework for better formatting
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ─── Liquibase Configuration ────────────────────────────────────────────────
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# ─── MVC Configuration ──────────────────────────────────────────────────────
# Switch to AntPathMatcher to allow complex SPA forwarding patterns like /**/{path}
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
